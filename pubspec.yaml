name: open_chat
description: "OpenChat: phased Flutter messaging with Supabase accounts and contacts."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  encrypt: ^5.0.3
  supabase_flutter: ^2.18.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  path: ^1.9.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logos/openchat_dove.png
    - assets/logos/openchat_dove_white.png
