name: openchat_web
description: "OpenChat Web — WhatsApp Web style companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.0
  shared_preferences: ^2.5.6
  http: ^1.6.0
  crypto: ^3.0.7
  cryptography: ^2.7.0
  uuid: ^4.6.0
  emoji_picker_flutter: ^4.5.4
  image_picker: ^1.2.4
  file_picker: ^10.2.4
  video_player: ^2.9.0
  flutter_contacts: ^2.6.0
  geolocator: ^14.0.1
  google_sign_in: ^6.3.0
  qr_flutter: ^4.1.0
  connectivity_plus: ^7.3.1
  app_links: ^7.2.2
  just_audio: ^0.10.6
  record: ^7.1.2
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  path: ^1.9.1

  # Web-only: IndexedDB wrapper
  indexed_db: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/logos/openchat_dove.png
    - assets/logos/openchat_dove_white.png
    - assets/stickers/heart.png
    - assets/stickers/thumbs_up.png
    - assets/stickers/laugh.png
    - assets/stickers/wow.png
    - assets/stickers/cry.png
    - assets/stickers/pray.png

flutter_native_splash:
  color: "#0B141A"
  image: assets/logos/openchat_dove_white.png
  color_dark: "#0B141A"
  image_dark: assets/logos/openchat_dove_white.png
  web: true