name: open_chat
description: "OpenChat: phased Flutter messaging with Supabase accounts and contacts."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  cryptography: ^2.7.0
  supabase_flutter: ^2.18.0
  shared_preferences: ^2.5.6
  sqflite: ^2.4.2
  image_picker: ^1.2.4
  url_launcher: ^6.3.2
  video_player: ^2.9.0
  flutter_secure_storage: ^9.2.4
  livekit_client: ^2.13.0
  permission_handler: ^12.0.0
  path_provider: ^2.1.6
  path: ^1.9.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  http: ^1.6.0
  flutter_local_notifications: ^22.3.2
  emoji_picker_flutter: ^4.5.4
  just_audio: ^0.10.6
  record: ^7.1.2
  file_picker: ^10.2.4
  open_filex: ^4.7.0
  local_auth: ^3.0.2
  firebase_auth: ^6.7.0
  flutter_contacts: ^2.6.0
  geolocator: ^14.0.1
  google_sign_in: ^6.3.0
  qr_flutter: ^4.1.0
  connectivity_plus: ^7.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
  flutter_native_splash: ^2.4.8
flutter:
  uses-material-design: true

  assets:
    - assets/logos/openchat_dove.png
    - assets/logos/openchat_dove_white.png

flutter_native_splash:
  color: "#0B141A"
  image: assets/logos/openchat_dove_white.png
  color_dark: "#0B141A"
  image_dark: assets/logos/openchat_dove_white.png
  android: true
  ios: true
  web: false
