name: open_chat
description: "OpenChat: phased Flutter messaging with Supabase accounts and contacts."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  cryptography: ^2.7.0
  supabase_flutter: ^2.18.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  url_launcher: ^6.3.2
  video_player: ^2.9.0
  flutter_secure_storage: ^9.2.4
  livekit_client: ^2.13.0
  permission_handler: ^12.0.0
  path_provider: ^2.1.6
  path: ^1.9.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  http: ^1.6.0
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/logos/openchat_dove.png
    - assets/logos/openchat_dove_white.png
